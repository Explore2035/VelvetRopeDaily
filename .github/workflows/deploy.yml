name: VelvetRopeDaily – Build & Deploy

on:
  schedule:
    - cron: '0 12 * * *'   # Daily at 8:00 AM ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic feedparser requests

      - name: Run VelvetRopeDaily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python velvetrope_pipeline.py

      - name: Commit & push index.html
        run: |
          git config user.name "VelvetRopeDaily Bot"
          git config user.email "bot@velvetropedaily.com"
          git add index.html
          git diff --cached --quiet || git commit -m "🎬 Daily update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
